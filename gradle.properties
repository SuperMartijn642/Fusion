# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft
minecraft_version=26.1.2
minecraft_dependency=>=26.1 <26.2
minecraft_suffix=mc26.1
java_target=25
java_dependency=>=25

# Fabric
fabric_loader_version=0.19.2
fabric_loader_dependency=>=0.18.6
fabric_api_version=0.146.1+26.1.2
fabric_api_dependency=>=0.145.0

# Mixin
mixin_minimum_version=0.8
mixin_package=mixin
mixin_compatibility_level=JAVA_17
mixin_plugin=FusionMixinPlugin

# Mod properties
mod_name=Fusion
mod_description=Fusion allows resource packs to use additional texture and model types such as connected textures!
mod_id=fusion
mod_version=1.3.2
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/fusion-connected-textures
mod_sources=https://github.com/SuperMartijn642/Fusion
mod_issues=https://github.com/SuperMartijn642/Fusion/issues
mod_package=com.supermartijn642.fusion
mod_main_class=Fusion
mod_client_class=FusionClient
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=26.1 26.1.1
curseforge_project_id=854949
curseforge_required_dependency_ids=fabric-api
curseforge_optional_dependency_ids=
