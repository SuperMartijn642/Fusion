# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# Minecraft
minecraft_version=26.2
minecraft_dependency=[26.2,26.3)
minecraft_suffix=mc26.2
java_target=25
java_dependency=>=25

# Forge
forge_version=65.0.0
forge_dependency=[65.0.0,)
javafml_dependency=[1,)
net.minecraftforge.gradle.merge-source-sets=true

# Mixin
mixin_minimum_version=0.8
mixin_package=mixin
mixin_compatibility_level=JAVA_21

# Mod properties
mod_name=Fusion
mod_description=Fusion allows resource packs to use additional texture and model types such as connected textures!
mod_id=fusion
mod_version=1.3.6
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/fusion-connected-textures
mod_sources=https://github.com/SuperMartijn642/Fusion
mod_issues=https://github.com/SuperMartijn642/Fusion/issues
mod_package=com.supermartijn642.fusion
mod_main_class=Fusion
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=26.2
